name: Shared live project status renderer

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project repository
        uses: actions/checkout@v4

      - name: Check out Perfect Foundations status tooling
        uses: actions/checkout@v4
        with:
          repository: Perfect-Foundations/perfect-family
          path: .perfect-family-status
          ref: main

      - name: Render and validate live status
        run: python3 .perfect-family-status/tools/render_status.py .

      - name: Validate generated Markdown
        run: git diff --check

      - name: Commit synchronized status display
        shell: bash
        run: |
          if git diff --quiet -- README.md docs/PROJECT-BLUEPRINT.md; then
            echo "Visible status is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/PROJECT-BLUEPRINT.md
          git commit -m "docs: sync live project status [skip ci]"
          git push
